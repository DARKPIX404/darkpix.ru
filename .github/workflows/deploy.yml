name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # --- SelfFlow: собираем веб-приложение и встраиваем как подсайт /selfflow/ ---
      - name: Checkout SelfFlow
        uses: actions/checkout@v4
        with:
          repository: DARKPIX404/SelfFlow
          path: selfflow

      - name: Setup Node for SelfFlow build
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: selfflow/web/package-lock.json

      - name: Build SelfFlow web
        working-directory: selfflow/web
        run: |
          npm ci
          npx vite build --base=/selfflow/

      - name: Embed SelfFlow into site
        run: |
          mkdir -p public/selfflow
          cp -r selfflow/web/dist/* public/selfflow/

      - name: Build with Next.js
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
